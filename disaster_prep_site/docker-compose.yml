version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5001:5001"
    # ボリュームは、リビルドせずにコード変更を反映できるため、開発に役立ちます。
    # このタスクでは、本番同様のセットアップに焦点を当てているため、コードはDockerfileでコピーされます。
    # データCSVについては、イメージをリビルドせずに変更を許可するためにマウントします。
    volumes:
      # - ./backend/app:/app/app # 例: バックエンドコードのライブリロード用
      # - ./backend/documents:/app/documents # 例: ドキュメントが頻繁に更新される場合
      # - ./backend/vectorstore_faiss:/app/vectorstore_faiss # 例: ベクターストアがイメージ外で管理される場合
      - ./data:/app/data # プロジェクトのdataディレクトリをコンテナ内の /app/data にマウントします
    env_file:
      - ./backend/.env # .env ファイルの環境変数をコンテナで利用可能にします
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80" # ホストのポート3000をコンテナのポート80 (Nginxのデフォルト) にマッピングします
    depends_on:
      - backend # フロントエンドの前にバックエンドが利用可能であることを保証します (API呼び出しに便利)
    restart: unless-stopped
